name: Verify research release
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_release.py
      - run: python -m pip install -r requirements-minimal.txt
      - run: python scripts/audit_predictions.py --output work/prediction_audit.json
